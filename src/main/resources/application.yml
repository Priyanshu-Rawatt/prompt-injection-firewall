spring:
  application:
    name: prompt-injection-firewall
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:google-genai}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  datasource:
    url: jdbc:h2:file:./data/firewall-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  port: 8080
  error:
    include-message: always

firewall:
  api-token: ${FIREWALL_API_TOKEN:demo-token}
  max-content-length: 120000
  block-threshold: 0.78
  review-threshold: 0.48
  llm:
    enabled: ${FIREWALL_LLM_ENABLED:true}
    provider: ${FIREWALL_LLM_PROVIDER:gemini}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:3b}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  ocr:
    enabled: ${FIREWALL_OCR_ENABLED:true}
    command: ${TESSERACT_COMMAND:tesseract}
    timeout-seconds: ${FIREWALL_OCR_TIMEOUT_SECONDS:20}
    max-pages: ${FIREWALL_OCR_MAX_PAGES:30}
    dpi: ${FIREWALL_OCR_DPI:150}
    max-pixels: ${FIREWALL_OCR_MAX_PIXELS:40000000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
